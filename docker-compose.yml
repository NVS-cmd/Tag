# Локальный запуск для разработки и показа: `make up` или `docker compose up -d`
services:
  db:
    image: ${POSTGRES_IMAGE:-mirror.gcr.io/library/postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # Порт базы наружу НЕ открыт — к ней ходит только backend внутри Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-crm} -d $${POSTGRES_DB:-crm}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-mirror.gcr.io/library/python:3.12-slim}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "${APP_PORT:-8000}:8000"
    command: python manage.py runserver 0.0.0.0:8000 --insecure
    # «Здоров» = таблицы созданы и сервер отвечает. `docker compose up --wait` ждёт этого.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

volumes:
  pgdata:
